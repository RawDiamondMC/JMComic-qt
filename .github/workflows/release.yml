name: release
on:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    container:
      image: aosc/aosc-os:buildkit
      options: --platform=linux/amd64
    env:
      PACKAGENAME: jmcomic_linux_x64
    steps:
    - uses: actions/checkout@v7
    - name: Package tarball
      run: |
        python3 script/build_qrc.py
        tar --exclude='.git' -czf ${{ env.PACKAGENAME }}.tar.gz .
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.tar.gz
        retention-days: 7
